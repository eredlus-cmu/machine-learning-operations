name: Promote Prod
on:
  workflow_dispatch:
    inputs:
      model_version:
        description: MLflow model version to promote to production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-prod
  cancel-in-progress: false

env:
  MODEL_VERSION: ${{ inputs.model_version }}

jobs:
  set-prod-alias:
    runs-on: [self-hosted, vnet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install mlflow==2.10.0
      - name: Set prod alias
        env:
          MLFLOW_TRACKING_URI: http://${{ secrets.MLFLOW_PRIVATE_IP }}:5000
        run: |
          python scripts/promote_alias.py \
            --model-name credit_default_model \
            --version "$MODEL_VERSION" \
            --alias prod

  deploy-prod:
    needs: set-prod-alias
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to prod
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          MLFLOW_PRIVATE_IP: ${{ secrets.MLFLOW_PRIVATE_IP }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          VM_NAME: ${{ vars.PROD_VM_NAME }}
          VM_IP: ${{ vars.PROD_VM_IP }}
        run: |
          bash scripts/deploy_inference.sh \
            "$VM_IP" "$ACR_LOGIN_SERVER/credit-default-serve:latest" prod
      - name: Smoke tests
        env:
          INFERENCE_URL: http://${{ vars.PROD_VM_IP }}:8000
        run: |
          curl -fsS "$INFERENCE_URL/health"
          python3 -c 'import json, os, urllib.request; base=os.environ["INFERENCE_URL"]; version=json.load(urllib.request.urlopen(base + "/version", timeout=10)); assert version["model_alias"] == "prod" and str(version["model_version"]) == os.environ["MODEL_VERSION"], version; data=open("tests/golden/predict_request.json", "rb").read(); req=urllib.request.Request(base + "/predict", data=data, headers={"Content-Type": "application/json"}); result=json.load(urllib.request.urlopen(req, timeout=30)); assert result["predictions"] == [1, 0], result; print(version, result)'
