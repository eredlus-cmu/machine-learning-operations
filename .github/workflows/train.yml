name: Train
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: flake8 src && bandit -r src && pytest tests -k "not inference"

  build-images:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push train and inference images
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build -f docker/Dockerfile.train \
            -t "${ACR_LOGIN_SERVER}/train:latest" .
          docker push "${ACR_LOGIN_SERVER}/train:latest"
          docker build -f docker/Dockerfile.inference \
            -t "${ACR_LOGIN_SERVER}/credit-default-serve:latest" .
          docker push "${ACR_LOGIN_SERVER}/credit-default-serve:latest"

  train:
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: write
    outputs:
      model_version: ${{ steps.metrics.outputs.model_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Ephemeral training
        env:
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
          LOCATION: ${{ vars.LOCATION || secrets.LOCATION }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          MLFLOW_TRACKING_URI: http://${{ secrets.MLFLOW_PRIVATE_IP }}:5000
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TRAIN_UAI_ID: ${{ vars.TRAIN_UAI_ID }}
          TRAIN_IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/train:latest
          IMAGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/run_training_vm.sh
      - id: metrics
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open('metrics.json'))
          print(f"model_version={d['model_version']}")
          PY
      # TODO(task2): after a version is registered, dispatch promote-beta.yml with that version.